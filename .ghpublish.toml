# .ghpublish.toml —— 本仓的发布清单。写一次，之后同步复用。
# allow: 永久批准发布的路径 glob（支持 **）
# deny : 永久拒绝的路径 glob
# 两边都不匹配的文件 = 新文档，preflight 会提示一次。

[docs]
allow = ["README.md", "README.zh.md", "README.en.md", "README.zh-CN.md", "LICENSE", "LICENSE.md", "LICENSE.txt", "CONTRIBUTING.md", "CHANGELOG.md", "SECURITY.md", "CODE_OF_CONDUCT.md", ".gitignore", ".gitattributes", "requirements.txt", "third_party/breeze-tts/requirements.txt", "third_party/breeze-tts/LICENSE"]
deny  = []

[meta]
source_path = "~/Desktop/aicode/AsherGithub/sources/Breeze-TTS-2-flash"
